AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Plain-HTTP cartelera.cdmx.gob.mx scraper with site health check and Step Functions orchestration

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that receives pipeline failure alerts via SNS
  GithubTokenParameterName:
    Type: String
    Default: /cultura-cdmx/github-token
    Description: SSM Parameter Store name holding the GitHub token (SecureString)

Resources:

  # --------------------------
  # Lambda: Site Health Check
  # --------------------------
  SiteHealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./cartelera
      Handler: health.lambda_handler
      Runtime: python3.12
      Timeout: 180
      MemorySize: 256
      Architectures:
        - x86_64
      Role: !GetAtt SiteHealthCheckRole.Arn
    Tags:
      Project: Cultura
      Environment: Dev
      Type: SingleRun

  SiteHealthCheckRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # --------------------------
  # Lambda: Scrape Cartelera
  # --------------------------
  CarteleraScrapeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./cartelera
      Handler: scrape.lambda_handler
      Runtime: python3.12
      Timeout: 600
      MemorySize: 512
      Architectures:
        - x86_64
      Environment:
        Variables:
          BUCKET_NAME: !Ref CulturaBucket
          CACHE_TTL_DAYS: "3"
      Role: !GetAtt CarteleraScrapeRole.Arn
    Tags:
      Project: Cultura
      Environment: Dev
      Type: MultiRun

  CarteleraScrapeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3WriteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${CulturaBucket.Arn}/*"
              # ListBucket so a missing cache key surfaces as 404, not 403
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt CulturaBucket.Arn

  # --------------------------
  # S3 Bucket
  # --------------------------
  CulturaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::Region}-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldObjects
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # --------------------------
  # SNS: Pipeline Alerts
  # --------------------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: cultura-cartelera-alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # --------------------------
  # Lambda Layer: DuckDB
  # --------------------------
  DuckDBLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: duckdb-layer
      Description: "Lambda layer providing duckdb Python library"
      ContentUri: ./layers/duckdb   # folder with requirements.txt
      CompatibleRuntimes:
        - python3.11
        - python3.12
      RetentionPolicy: Retain

  DuckDBFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ReadWriteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Allow reading JSON input files
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt CulturaBucket.Arn
                  - !Sub "${CulturaBucket.Arn}/*"
              # Allow writing Parquet output files
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub "${CulturaBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GithubTokenParameterName}"



  # --------------------------
  # Lambda: DuckDB Coalesce
  # --------------------------
  DuckDBFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./duckdb_handler
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 1024
      Role: !GetAtt DuckDBFunctionRole.Arn
      Layers:
        - !Ref DuckDBLayer
      Environment:
        Variables:
          BUCKET_NAME: !Ref CulturaBucket
          GITHUB_OWNER: "dar4datascience"
          GITHUB_REPO: "AWS-SAM-Cultura-CDMX"
          GITHUB_TOKEN_PARAMETER: !Ref GithubTokenParameterName

  GenerateSnapshotDateLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./generate_snapshot_date
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt GenerateSnapshotDateRole.Arn

  GenerateSnapshotDateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # --------------------------
  # Step Functions State Machine
  # --------------------------
  CulturaScrapeStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt CulturaStateMachineRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Health-check the cartelera site, scrape all events over plain HTTP, then merge into Parquet with DuckDB",
          "TimeoutSeconds": 7200,
          "StartAt": "GenerateSnapshotDate",
          "States": {
            "GenerateSnapshotDate": {
              "Type": "Task",
              "Resource": "${GenerateSnapshotDateLambda.Arn}",
              "ResultPath": "$.snapshot_date",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }
              ],
              "Next": "CheckSiteHealth"
            },
            "CheckSiteHealth": {
              "Type": "Task",
              "Resource": "${SiteHealthCheckFunction.Arn}",
              "ResultPath": "$.health",
              "Retry": [
                {
                  "ErrorEquals": [
                    "SiteUnavailable"
                  ],
                  "IntervalSeconds": 300,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                },
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "SiteUnavailable",
                    "SiteChanged"
                  ],
                  "ResultPath": "$.error",
                  "Next": "NotifySiteDown"
                },
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }
              ],
              "Next": "ScrapeEvents"
            },
            "ScrapeEvents": {
              "Type": "Task",
              "Resource": "${CarteleraScrapeFunction.Arn}",
              "Parameters": {
                "snapshot_date.$": "$.snapshot_date.snapshot_date"
              },
              "ResultPath": "$.scrape",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "Lambda.TooManyRequestsException"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }
              ],
              "Next": "DuckDBStep"
            },
            "DuckDBStep": {
              "Type": "Task",
              "Comment": "Merge JSONs into Parquet using DuckDB",
              "Resource": "${DuckDBFunction.Arn}",
              "Parameters": {
                "snapshot_date.$": "$.snapshot_date.snapshot_date"
              },
              "ResultPath": "$.publish",
              "Retry": [
                {
                  "ErrorEquals": [
                    "Lambda.ServiceException",
                    "Lambda.AWSLambdaException",
                    "Lambda.SdkClientException",
                    "States.Timeout"
                  ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 2,
                  "BackoffRate": 2
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "ResultPath": "$.error",
                  "Next": "NotifyFailure"
                }
              ],
              "End": true
            },
            "NotifySiteDown": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${AlertsTopic}",
                "Subject": "Cultura CDMX: sitio cartelera no disponible - scraping detenido",
                "Message.$": "States.Format('El sitio https://cartelera.cdmx.gob.mx no respondió correctamente (snapshot {}). Se detuvo el pipeline sin ejecutar el scraping. Error: {} | Detalle: {} | Ejecución: {}', $.snapshot_date.snapshot_date, $.error.Error, $.error.Cause, $$.Execution.Id)"
              },
              "Next": "SiteDown"
            },
            "SiteDown": {
              "Type": "Fail",
              "Error": "SiteDown"
            },
            "NotifyFailure": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${AlertsTopic}",
                "Subject": "Cultura CDMX: falla en el pipeline de scraping",
                "Message.$": "States.Format('El pipeline de scraping de la cartelera CDMX falló. Error: {} | Detalle: {} | Ejecución: {}', $.error.Error, $.error.Cause, $$.Execution.Id)"
              },
              "Next": "PipelineFailed"
            },
            "PipelineFailed": {
              "Type": "Fail",
              "Error": "PipelineFailed"
            }
          }
        }


  CulturaStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSStepFunctionsFullAccess
      Policies:
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt SiteHealthCheckFunction.Arn
                  - !GetAtt CarteleraScrapeFunction.Arn
                  - !GetAtt GenerateSnapshotDateLambda.Arn
                  - !GetAtt DuckDBFunction.Arn
        - PolicyName: SnsPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref AlertsTopic


  # --------------------------
  # EventBridge Rule: Daily Trigger
  # --------------------------
  CulturaScrapeScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: CulturaScrapeDailyRule
      ScheduleExpression: "cron(0 12 ? * 2-6 *)"  # 12:00 UTC = 6:00 AM MX, Monday to Friday
      State: ENABLED
      Targets:
        - Arn: !Ref CulturaScrapeStateMachine
          Id: CulturaScrapeStateMachineTarget
          RoleArn: !GetAtt EventBridgeInvokeStepFnRole.Arn

  EventBridgeInvokeStepFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowStartExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref CulturaScrapeStateMachine
